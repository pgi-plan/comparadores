    :root {

      --primary-color: #1e40af;

      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #212529;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 40px;
    }

    /* Header */
    .app-header {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
      color: white;
      padding: 2rem 1rem;
      margin-bottom: 2rem;
      box-shadow: 0 4px 10px rgba(30, 64, 175, 0.2);
    }

    .app-header h1 {
      font-weight: 700;
      margin: 0;
    }

    .app-header .subtitle {
      opacity: 0.9;
      font-weight: 300;
      font-size: 1.1rem;
      margin-top: 5px;
    }

    /* Controls */
    .controls-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border-left: 5px solid var(--primary-color);
    }

    .form-label {
      font-weight: 500;
      color: var(--primary-color);
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .form-select,
    .btn {
      border-radius: 8px;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-primary:hover {
      background-color: var(--primary-light);
      border-color: var(--primary-light);
    }

    .btn-outline-primary {
      color: var(--primary-color);
      border-color: var(--primary-color);
    }

    .btn-outline-primary:hover,
    .btn-check:checked+.btn-outline-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
      color: white;
    }

    /* Note Card */
    .note-card {
      background: #eef2ff;
      border-left: 4px solid var(--primary-light);
      border-radius: 8px;
      padding: 14px 18px;
      margin-bottom: 24px;
      font-size: 0.9rem;
      color: #1e3a8a;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
    }

    .note-card .bi {
      color: var(--primary-color);
      font-size: 1.3rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .note-card strong {
      color: var(--primary-color);
    }

    /* Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    @media(max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .controls-card {
        flex-direction: column;
      }
    }

    /* Chart Cards */
    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid rgba(0, 0, 0, 0.05);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.03);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chart-header {
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
      background: #fafafa;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chart-title {
      font-weight: 700;
      color: var(--primary-color);
      font-size: 1rem;
      margin: 0;
    }

    .chart-body {
      padding: 10px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    /* Footers & Stats */
    .stats-footer {
      background: #fdfdfd;
      border-top: 1px solid #eee;
      padding: 10px 15px;
      font-size: 0.8rem;
      color: #555;
    }

    .stats-footer .muted-note {
      color: #888;
      font-size: 0.72rem;
      margin-top: 3px;
    }

    .table-stats {
      font-size: 0.8rem;
      margin-top: 10px;
      margin-bottom: 0;
    }

    .table-stats th {
      background-color: #f8f9fa;
    }

    .stat-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      font-size: 0.7rem;
      margin-left: 5px;

      background-color: #e8f5e9;

    .badge-not-sig {
      background-color: #f5f5f5;
      color: #616161;
      border: 1px solid #e0e0e0;
    }

      color: #c62828;
      font-weight: bold;

    .trend-flat {

      text-align: center;
      font-size: 13px;
      color: #999;
    }

    footer a {
      color: var(--primary-light);
      text-decoration: none;

</head>

  <header class="app-header">
    <div class="container-fluid px-4">
      <h1>RUR Rankings — UFF Analytics</h1>
      <div class="subtitle">Round University Ranking · Comparative Analysis (2019–2026)</div>
    </div>
  </header>

  <div class="container-fluid px-4">
    <div class="controls-card">
      <div class="row g-3 align-items-end">
        <div class="col-md-3">
          <label class="form-label"><i class="bi bi-building"></i> Compare UFF with:</label>
          <select id="compareSelect" class="form-select">
            <option value="">Select an university...</option>
          </select>
        </div>
        <div class="col-md-3">
          <label class="form-label"><i class="bi bi-calendar-range"></i> Period:</label>
          <div class="input-group">
            <select id="minYear" class="form-select"></select>
            <span class="input-group-text bg-light text-muted">to</span>
            <select id="maxYear" class="form-select"></select>
          </div>
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="bi bi-sliders"></i> Metric:</label>
          <select id="metricSelect" class="form-select">
            <option value="score" selected>Score</option>
            <option value="world_rank">World rank</option>
            <option value="country_rank">Country rank (BR)</option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="bi bi-graph-up"></i> Visualization:</label>
          <div class="btn-group w-100" role="group">
            <input type="radio" class="btn-check" name="chartType" id="typeLine" value="line" checked>
            <label class="btn btn-outline-primary" for="typeLine"><i class="bi bi-bezier2"></i> Trends</label>
            <input type="radio" class="btn-check" name="chartType" id="typeBox" value="box">
            <label class="btn btn-outline-primary" for="typeBox"><i class="bi bi-box-seam"></i> Dist.</label>
          </div>
        </div>
        <div class="col-md-2">
          <label class="form-label"><i class="bi bi-chat-left-text"></i> Data Labels:</label>
          <div class="d-flex gap-2 mt-2">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="annMode" id="annUff" value="uff" checked>
              <label class="form-check-label" for="annUff">UFF</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="annMode" id="annBoth" value="both">
              <label class="form-check-label" for="annBoth">Both</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="annMode" id="annNone" value="none">
              <label class="form-check-label" for="annNone">Off</label>
            </div>
          </div>
        </div>
      </div>
      <div class="row mt-3">
        <div class="col-12 d-flex justify-content-between align-items-center">
          <div id="status" class="text-primary fw-bold small">
            <div class="spinner-border spinner-border-sm" role="status"></div> Loading dataset...
          </div>
          <div>
            <button id="refreshBtn" class="btn btn-sm btn-outline-secondary me-2"><i class="bi bi-arrow-clockwise"></i>
              Reset</button>
            <button id="applyFilter" class="btn btn-primary px-4"><i class="bi bi-check2-circle"></i> Update
              Dashboard</button>
          </div>
        </div>
      </div>
    </div>

    <div id="charts" class="grid"></div>

    <footer>
      <strong>Data Source:</strong> Round University Ranking (RUR) — Brazil. Developed by PGI/PLAN (UFF).
    </footer>
  </div>

        { key: "international_diversity", label: "International Diversity" }
      ];

      // --- Globals ---
      const chartsDiv = document.getElementById("charts");
      const compareSelect = document.getElementById("compareSelect");
      const minYear = document.getElementById("minYear");
      const maxYear = document.getElementById("maxYear");
      const metricSelect = document.getElementById("metricSelect");
      const statusEl = document.getElementById("status");

      let annotationMode = "uff";
      let chartType = "line";
      let metric = "score";
      let rows = [];
      let INDEX = {}; // INDEX[indicador][universidade][ano] = {score, rank, crank}

      // Definicao das metricas plotaveis
      const METRICS = {
        score:        { field: "score", label: "Score",             isRank: false, dec: 1 },
        world_rank:   { field: "rank",  label: "World rank",         isRank: true,  dec: 0 },
        country_rank: { field: "crank", label: "Country rank (BR)",  isRank: true,  dec: 0 }
      };
      const M = () => METRICS[metric];

      // --- Utils ---
      const parseNumber = v => {
        if (v == null) return NaN;
        v = String(v).replace(/–/g, "-").replace(/,/g, ".");
        const m = v.match(/-?\d+(\.\d+)?/);
        return m ? +m[0] : NaN;
      };
      const isValid = v => typeof v === "number" && !isNaN(v);
      const hasComparison = name => name && name !== uffName;

      function buildIndex() {
        INDEX = {};
        rows.forEach(r => {
          const ind = (r.indicador || "").trim();
          const uni = (r.universidade || "").trim();
          const y = parseNumber(r.ano);
          if (!ind || !uni || !isValid(y)) return;
          const score = parseNumber(r.score);
          const rank = parseNumber(r.rank);
          const crank = parseNumber(r.country_rank);
          (INDEX[ind] = INDEX[ind] || {});
          (INDEX[ind][uni] = INDEX[ind][uni] || {});
          INDEX[ind][uni][y] = {
            score: isValid(score) ? score : null,
            rank: isValid(rank) ? rank : null,
            crank: isValid(crank) ? crank : null
          };
        });
      }
      const getCell = (ind, uni, y) =>
        (INDEX[ind] && INDEX[ind][uni] && INDEX[ind][uni][y]) || null;

      // --- Stats: Mann-Kendall (significancia em p<0.05) ---
      // isRank=true: valor menor = melhor, entao tendencia decrescente = "Improving".
      function calculateMannKendall(data, isRank) {
        const n = data.length;
        if (n < 4) return { text: "Insufficient Data", p: null, trend: "trend-flat", sig: false };
        let S = 0;
        for (let k = 0; k < n - 1; k++) {
          for (let j = k + 1; j < n; j++) S += Math.sign(data[j] - data[k]);
        }
        const counts = {}; data.forEach(x => counts[x] = (counts[x] || 0) + 1);
        let tieTerm = 0; Object.values(counts).forEach(t => { if (t > 1) tieTerm += t * (t - 1) * (2 * t + 5); });
        const varS = (n * (n - 1) * (2 * n + 5) - tieTerm) / 18;
        if (varS === 0) return { text: "Stable", p: 1.0, trend: "trend-flat", sig: false };
        let Z = 0; if (S > 0) Z = (S - 1) / Math.sqrt(varS); else if (S < 0) Z = (S + 1) / Math.sqrt(varS);
        const p = 2 * (1 - jStat.normal.cdf(Math.abs(Z), 0, 1));
        const sig = p < 0.05;
        let text = "Stable", trendClass = "trend-flat";
        if (sig) {
          if (isRank) {
            // S<0: rank caindo (posicao melhora) -> Improving
            if (S < 0) { text = "Improving ↗"; trendClass = "trend-up"; }
            else { text = "Worsening ↘"; trendClass = "trend-down"; }
          } else {
            if (S > 0) { text = "Increasing ↗"; trendClass = "trend-up"; }
            else { text = "Decreasing ↘"; trendClass = "trend-down"; }
          }
        }
        return { text, p, trend: trendClass, z: Z, sig };
      }

      // --- Stats: Summary Table ---
      function getSummaryStats(arr) {
        if (!arr || arr.length === 0) return null;
        return {
          n: arr.length, mean: jStat.mean(arr), median: jStat.median(arr),
          stdev: arr.length > 1 ? jStat.stdev(arr, true) : 0, min: jStat.min(arr), max: jStat.max(arr)
        };
      }

      function createSummaryTableHTML(uffArr, cmpArr, cmpName) {
        const sUff = getSummaryStats(uffArr);
        const sCmp = (cmpName && cmpArr.length) ? getSummaryStats(cmpArr) : null;
        if (!sUff) return "";
        const dec = M().dec;
        const fmt = (n) => n.toFixed(dec);
        const fmtSd = (n) => n.toFixed(Math.max(dec, 2)); // desvio-padrao sempre com >=2 casas
        return `
          <table class="table table-bordered table-sm table-stats">
            <thead>
              <tr><th>Metric</th><th>UFF (n=${sUff.n})</th>${sCmp ? `<th>${cmpName} (n=${sCmp.n})</th>` : ''}</tr>
            </thead>
            <tbody>
              <tr><td>Mean</td><td>${fmt(sUff.mean)}</td>${sCmp ? `<td>${fmt(sCmp.mean)}</td>` : ''}</tr>
              <tr><td>Median</td><td>${fmt(sUff.median)}</td>${sCmp ? `<td>${fmt(sCmp.median)}</td>` : ''}</tr>
              <tr><td>Std Dev</td><td>${fmtSd(sUff.stdev)}</td>${sCmp ? `<td>${fmtSd(sCmp.stdev)}</td>` : ''}</tr>
              <tr><td>Min / Max</td><td>${fmt(sUff.min)} / ${fmt(sUff.max)}</td>${sCmp ? `<td>${fmt(sCmp.min)} / ${fmt(sCmp.max)}</td>` : ''}</tr>
            </tbody>
          </table>
        `;
      }

      // --- Stats: Teste t PAREADO (emparelhado por ano) ---
      // uffArr[i] e cmpArr[i] sao o mesmo ano. Testa H0: media das diferencas = 0.
      function calculatePairedTTest(uffArr, cmpArr) {
        const n = uffArr.length;
        if (n < 3) return { error: "Pares insuficientes (n<3)" };
        const d = uffArr.map((a, i) => a - cmpArr[i]);
        const meanD = jStat.mean(d);
        const sdD = jStat.stdev(d, true);
        // Checagem descritiva das variancias dos dois grupos (F-test)
        const vUff = jStat.variance(uffArr, true);
        const vCmp = jStat.variance(cmpArr, true);
        let fStat = (vUff >= vCmp) ? (vCmp === 0 ? Infinity : vUff / vCmp) : vCmp / vUff;
        const pF = isFinite(fStat) ? 2 * (1 - jStat.centralF.cdf(fStat, n - 1, n - 1)) : 0;
        const equalVar = pF > 0.05;
        if (sdD === 0) {
          return {
            n, meanD, testUsed: "Paired t-test", pValT: (meanD === 0 ? 1 : 0),
            significant: meanD !== 0, vUff, vCmp, fStat, pF, equalVar
          };
        }
        const se = sdD / Math.sqrt(n);
        const tStat = meanD / se;
        const df = n - 1;
        const pValT = 2 * (1 - jStat.studentt.cdf(Math.abs(tStat), df));
        return {
          n, meanD, tStat, df, pValT, significant: pValT < 0.05,
          testUsed: "Paired t-test", vUff, vCmp, fStat, pF, equalVar
        };
      }

      // --- Load Data ---
      try {
        let text;
        if (RUR_CSV_URL) {
          text = await fetch(RUR_CSV_URL).then(r => r.text());
        } else {
          text = RUR_CSV;
        }
        rows = Papa.parse(text.trim(), { header: true, skipEmptyLines: true }).data;
        if (!rows.length) throw new Error("Empty dataset");
        buildIndex();
        statusEl.innerHTML = '<i class="bi bi-check-circle-fill text-success"></i> Data Ready';
      } catch (err) {
        statusEl.innerHTML = '<span class="text-danger">Error loading data</span>';
        console.error(err);
        return;
      }

      // --- Setup Filters ---
      const uniNames = [...new Set(rows.map(r => (r.universidade || "").trim()))]
        .filter(n => n && n !== uffName)
        .sort((a, b) => a.localeCompare(b, 'pt', { sensitivity: 'base' }));
      uniNames.forEach(n => compareSelect.add(new Option(n, n)));

      const years = [...new Set(rows.map(r => parseNumber(r.ano)).filter(isValid))].sort((a, b) => a - b);
      years.forEach(y => { minYear.add(new Option(y, y)); maxYear.add(new Option(y, y)); });
      minYear.value = years[0];
      maxYear.value = years.at(-1);

      // --- Render ---
      function render(compareTo = "") {
        chartsDiv.innerHTML = "";
        const hasCmp = hasComparison(compareTo);
        const startY = parseInt(minYear.value, 10);
        const endY = parseInt(maxYear.value, 10);

        const yrRange = [];
        for (let y = startY; y <= endY; y++) yrRange.push(y);

        INDICATORS.forEach(indObj => {
          const ind = indObj.key;
          if (!INDEX[ind]) return;

          const fld = M().field; // campo plotado: score | rank | crank
          const uffTime = [], cmpTime = [], uffData = [], cmpData = [];
          const uffPaired = [], cmpPaired = [];
          const uffMeta = [], cmpMeta = []; // p/ hover dos boxplots (year, score, rank, crank)

          yrRange.forEach(y => {
            const cu = getCell(ind, uffName, y);
            const vu = cu ? cu[fld] : null; // valor da metrica selecionada
            uffTime.push({ x: y, y: isValid(vu) ? vu : null, score: cu ? cu.score : null, rank: cu ? cu.rank : null, crank: cu ? cu.crank : null });
            if (isValid(vu)) uffData.push(vu);

            let cc = null, vc = null;
            if (hasCmp) {
              cc = getCell(ind, compareTo, y);
              vc = cc ? cc[fld] : null;
              cmpTime.push({ x: y, y: isValid(vc) ? vc : null, score: cc ? cc.score : null, rank: cc ? cc.rank : null, crank: cc ? cc.crank : null });
              if (isValid(vc)) cmpData.push(vc);
            }
            // Pares completos (mesmo ano com dado em ambos) -> base do teste pareado
            if (hasCmp && isValid(vu) && isValid(vc)) {
              uffPaired.push(vu);
              cmpPaired.push(vc);
              uffMeta.push({ y, score: cu.score, rank: cu.rank, crank: cu.crank });
              cmpMeta.push({ y, score: cc.score, rank: cc.rank, crank: cc.crank });
            }
          });
          // Meta p/ box sem comparacao = todos os anos com valor valido da metrica
          if (!hasCmp) {
            yrRange.forEach(y => {
              const cu = getCell(ind, uffName, y);
              if (cu && isValid(cu[fld])) uffMeta.push({ y, score: cu.score, rank: cu.rank, crank: cu.crank });
            });
          }

          if (uffData.length === 0 && cmpData.length === 0) return;

          // Create Card
          const card = document.createElement("div");
          card.className = "chart-card";
          card.innerHTML = `<div class="chart-header"><h3 class="chart-title">${indObj.label}</h3></div>`;
          const body = document.createElement("div");
          body.className = "chart-body";
          const plotDiv = document.createElement("div");
          plotDiv.style.height = "300px";
          body.appendChild(plotDiv);
          card.appendChild(body);
          chartsDiv.appendChild(card);

          const yAxisConfig = { title: M().label, automargin: true, gridcolor: "#f0f0f0" };
          // Rank: menor = melhor -> eixo invertido
          yAxisConfig.autorange = M().isRank ? "reversed" : true;
          const xAxisConfig = { gridcolor: "#f0f0f0", automargin: true };
          if (chartType === 'line') {
            xAxisConfig.title = 'Year';
            xAxisConfig.dtick = 1;
            xAxisConfig.range = [startY - 0.5, endY + 0.5];
            xAxisConfig.autorange = false;
          } else {
            xAxisConfig.autorange = true;
          }

          const layout = {
            margin: { t: 30, l: 50, r: 20, b: 30 },
            font: { family: 'Roboto, sans-serif', size: 11 },
            yaxis: yAxisConfig, xaxis: xAxisConfig,
            showlegend: true, legend: { orientation: "h", x: 0, y: 1.3 },
            paper_bgcolor: "#ffffff",
            plot_bgcolor: "#ffffff"
          };

          const config = {
            responsive: true,
            displayModeBar: 'hover',
            displaylogo: false,
            modeBarButtonsToRemove: ['select2d', 'lasso2d']
          };

          if (chartType === "line") {
            const dash = v => (v != null ? v : "—");
            const dec = M().dec;
            const lineHover = who =>
              "%{x}<br>Score: %{customdata[0]}<br>World rank: %{customdata[1]}<br>Country rank (BR): %{customdata[2]}<extra>" + who + "</extra>";
            const cdata = arr => arr.map(d => [
              (d.score != null ? d.score.toFixed(1) : "—"),
              dash(d.rank), dash(d.crank)
            ]);
            const traces = [{
              x: uffTime.map(d => d.x), y: uffTime.map(d => d.y),
              customdata: cdata(uffTime),
              mode: "lines+markers", name: "UFF",
              connectgaps: false,
              hovertemplate: lineHover("UFF"),
              line: { color: "#1e40af", width: 3 }, marker: { size: 6 }
            }];
            if (hasCmp) {
              traces.push({
                x: cmpTime.map(d => d.x), y: cmpTime.map(d => d.y),
                customdata: cdata(cmpTime),
                mode: "lines+markers", name: compareTo,
                connectgaps: false,
                hovertemplate: lineHover(compareTo),
                line: { color: "#ff9800", width: 3, dash: "dot" }, marker: { size: 6 }
              });
            }

            const anns = [];
            const addAnn = (arr, col) => arr.forEach(d => {
              if (d.y !== null) anns.push({
                x: d.x, y: d.y, text: d.y.toFixed(dec),
                showarrow: false, yshift: 12,
                font: { color: col, size: 10, weight: "bold" }, bgcolor: "rgba(255,255,255,0.8)"
              });
            });
            if (annotationMode === "uff" || annotationMode === "both") addAnn(uffTime, "#1e40af");
            if (annotationMode === "both" && hasCmp) addAnn(cmpTime, "#e65100");
            layout.annotations = anns;

            Plotly.newPlot(plotDiv, traces, layout, config);

            // Mann-Kendall Footer
            const mkUff = calculateMannKendall(uffData, M().isRank);
            const footer = document.createElement("div");
            footer.className = "stats-footer";
            const badgeMK = m => m.p == null ? "" :
              (m.sig ? `<span class="stat-badge badge-sig">Sig. (p&lt;0.05)</span>`
                     : `<span class="stat-badge badge-not-sig">n.s.</span>`);
            let mkHtml = `<div><strong>UFF Trend:</strong> <span class="${mkUff.trend}">${mkUff.text}</span> (p=${mkUff.p != null ? mkUff.p.toFixed(3) : '-'}) ${badgeMK(mkUff)}</div>`;
            if (hasCmp && cmpData.length > 0) {
              const mkCmp = calculateMannKendall(cmpData, M().isRank);
              mkHtml += `<div><strong>${compareTo} Trend:</strong> <span class="${mkCmp.trend}">${mkCmp.text}</span> (p=${mkCmp.p != null ? mkCmp.p.toFixed(3) : '-'}) ${badgeMK(mkCmp)}</div>`;
            }
            footer.innerHTML = mkHtml;
            card.appendChild(footer);

          } else {
            // Box Plot — quando ha comparacao, usa apenas os anos emparelhados
            const boxUff = hasCmp ? uffPaired : uffData;
            const boxCmp = cmpPaired;
            const dashB = v => (v != null ? v : "—");
            const boxHover = who =>
              "Year: %{customdata[0]}<br>Score: %{customdata[1]}<br>World rank: %{customdata[2]}<br>Country rank (BR): %{customdata[3]}<extra>" + who + "</extra>";
            const boxCdata = arr => arr.map(m => [
              m.y, (m.score != null ? m.score.toFixed(1) : "—"), dashB(m.rank), dashB(m.crank)
            ]);

            const traces = [{
              y: boxUff, type: 'box', name: 'UFF', marker: { color: '#1e40af' },
              boxpoints: 'all', jitter: 0.4, pointpos: 0,
              customdata: boxCdata(uffMeta),
              hovertemplate: boxHover("UFF")
            }];
            if (hasCmp) {
              traces.push({
                y: boxCmp, type: 'box', name: compareTo, marker: { color: '#ff9800' },
                boxpoints: 'all', jitter: 0.4, pointpos: 0,
                customdata: boxCdata(cmpMeta),
                hovertemplate: boxHover(compareTo)
              });
            }
            Plotly.newPlot(plotDiv, traces, layout, config);

            // Summary Stats Table
            if (boxUff.length > 0) {
              const tableContainer = document.createElement("div");
              tableContainer.style.padding = "0 10px 10px 10px";
              tableContainer.innerHTML = createSummaryTableHTML(boxUff, boxCmp, compareTo);
              body.appendChild(tableContainer);
            }

            // Teste t pareado
            if (hasCmp) {
              const footer = document.createElement("div");
              footer.className = "stats-footer";
              if (uffPaired.length < 3) {
                footer.innerHTML = `<div><strong>Paired t-test:</strong> pares insuficientes (n=${uffPaired.length}, requer ≥3 anos em comum)</div>`;
              } else {
                const st = calculatePairedTTest(uffPaired, cmpPaired);
                const badge = st.significant
                  ? `<span class="stat-badge badge-sig">Sig. Diff (p&lt;0.05)</span>`
                  : `<span class="stat-badge badge-not-sig">Not Significant</span>`;
                footer.innerHTML =
                  `<div><strong>${st.testUsed}</strong> (n pares=${st.n}) | p=${st.pValT.toFixed(4)} ${badge}</div>` +
                  `<div class="muted-note">Variâncias — UFF: ${st.vUff.toFixed(2)} · ${compareTo}: ${st.vCmp.toFixed(2)} (F=${isFinite(st.fStat) ? st.fStat.toFixed(2) : '∞'}, p=${st.pF.toFixed(3)} → ${st.equalVar ? 'variâncias equivalentes' : 'variâncias distintas'})</div>`;
              }
              card.appendChild(footer);
            }
          }
        });
      }

      compareSelect.onchange = e => render(e.target.value);
      minYear.onchange = () => render(compareSelect.value);
      maxYear.onchange = () => render(compareSelect.value);
      metricSelect.onchange = e => { metric = e.target.value; render(compareSelect.value); };

      document.getElementById("applyFilter").onclick = () => render(compareSelect.value);
      document.getElementById("refreshBtn").onclick = () => location.reload();
      document.querySelectorAll("input[name='annMode']").forEach(r => r.onchange = e => { annotationMode = e.target.value; render(compareSelect.value); });
      document.querySelectorAll("input[name='chartType']").forEach(r => r.onchange = e => { chartType = e.target.value; render(compareSelect.value); });

      render();
    })();
  </script>
</body>

</html>
